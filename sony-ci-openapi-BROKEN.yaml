openapi: "2.0"

info:
  title: Sony Ci Media Cloud

paths:

  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces
      description: Lists the workspaces the user can access.
      responses:
        '200':
          description: OK

  /assets/{assetId}:
    get:
      operationId: getAsset
      summary: Get asset
      description: Returns the details of a single asset from Ci.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

  /assets/{assetId}/download:
    get:
      operationId: getAsset
      summary: Download asset
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
      responses:
        '200':
          description: OK

  /assets/trash:
    post:
      summary: Trash assets
      description: Moves assets to the trash bin.
      responses:
        '200':
          description: OK

security:
  - ciOAuth: []

components:
  schemas: {}
