# DEMO ARTIFACT - this file is sloppy, and Airia accepts it anyway.
#
# Every fault below is one an LLM actually produces when asked to turn API
# documentation into an OpenAPI spec: a Swagger 2.0 version header, no servers
# block, a duplicate operationId, a missing operationId, an undeclared path
# parameter, a dangling $ref, and a security scheme that is never defined.
#
# Airia's spec probe VERIFIES this file and discovers tools from it.
#
# That is the point of the demo. mcp-link, the converter behind Airia's OpenAPI
# servers, ignores every one of these faults. Verification proves a spec is
# fetchable and parseable. It does not prove the tools are usable or safe - that
# is what the human review of the tool list is for.
#
# See FINDINGS-mcp-link-behaviour.md for the source evidence.
openapi: "2.0"

info:
  title: Sony Ci Media Cloud

paths:

  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces
      description: Lists the workspaces the user can access.
      responses:
        '200':
          description: OK

  /assets/{assetId}:
    get:
      operationId: getAsset
      summary: Get asset
      description: Returns the details of a single asset from Ci.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

  /assets/{assetId}/download:
    get:
      operationId: getAsset
      summary: Download asset
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
      responses:
        '200':
          description: OK

  /assets/trash:
    post:
      summary: Trash assets
      description: Moves assets to the trash bin.
      responses:
        '200':
          description: OK

security:
  - ciOAuth: []

components:
  schemas: {}
